<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelalGuard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f4f6f8; padding-bottom: 70px; }
    .header { background: #007a43; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 18px; }
    .container { padding: 15px; }
    .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; resize: none; margin-bottom: 10px; }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-primary { background: #007a43; color: white; }
    .btn-camera { background: #27ae60; color: white; margin-bottom: 10px; font-size: 16px; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: white; border-top: 1px solid #ddd; display: flex; justify-content: space-around; align-items: center; }
    .nav-item { text-align: center; color: #777; font-size: 11px; text-decoration: none; cursor: pointer; flex: 1; }
    .nav-item.active { color: #007a43; font-weight: bold; }
    .nav-item span { display: block; font-size: 18px; margin-bottom: 2px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🛡️ HelalGuard</h1>
    <span style="border: 1px solid white; padding: 2px 8px; border-radius: 12px; font-size: 12px;">TR</span>
  </div>

  <div class="container">
    <!-- ANA SAYFA SEKMESİ -->
    <div id="tab-home" class="tab-content active">
      <div class="card">
        <h3>İçindekiler Analizi</h3>
        <p style="color:#666; font-size:12px; margin: 8px 0;">Ürün etiketindeki içindekiler listesini yapıştır, olası uyarıları gör.</p>
        <textarea id="txtIngredients" placeholder="Örn: şeker, su, jelatin, E471, tuz..."></textarea>
        <button class="btn-primary" onclick="analyzeText()">Analiz Et</button>
      </div>
      <div id="resultBox"></div>
    </div>

    <!-- BARKOD / KAMERA SEKMESİ -->
    <div id="tab-barcode" class="tab-content">
      <div class="card">
        <h3>Barkod / Kamera Okut</h3>
        <p style="color:#666; font-size:12px; margin: 8px 0;">Kamerayı açarak ürün üzerindeki barkodu taratabilirsiniz.</p>
        <button class="btn-camera" onclick="openCameraScanner()">📷 Kamerayı Aç ve Taramayı Başlat</button>
        <div style="margin-top:15px;">
          <input type="text" id="manualBarcode" placeholder="Veya barkod numarasını yazın..." style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; margin-bottom:10px;">
          <button class="btn-primary" onclick="searchBarcodeManual()">Barkod Sorgula</button>
        </div>
      </div>
      <div id="barcodeResultBox"></div>
    </div>

    <!-- GEÇMİŞ SEKMESİ -->
    <div id="tab-history" class="tab-content">
      <div class="card">
        <h3>Geçmiş Sorgular</h3>
        <div id="historyList" style="font-size:13px; color:#444;">Henüz taranmış ürün yok.</div>
      </div>
    </div>
  </div>

  <!-- ALT MENÜ -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('home', this)">
      <span>🏠</span>Ana Sayfa
    </div>
    <div class="nav-item" onclick="switchTab('barcode', this)">
      <span>║▌║</span>Barkod
    </div>
    <div class="nav-item" onclick="switchTab('history', this)">
      <span>🕒</span>Geçmiş
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
